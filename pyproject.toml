[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "binary-behavior-recovery"
version = "0.1.0"
description = "Bounded, provenance-aware binary behavior recovery instrument"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[project.scripts]
bbr = "bbr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bbr"]
